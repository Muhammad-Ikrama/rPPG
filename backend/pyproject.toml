[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg-vital-signs"
version = "1.0.0"
description = "Cloud-Connected rPPG Vital Signs Monitoring System"
authors = [{ name = "Biomedical Engineering FYP Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.8.0",
    "mediapipe>=0.10.9",
    "matplotlib>=3.8.0",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

version: '3.8'

services:
  # PostgreSQL Production Database
  db:
    image: postgres:16-alpine
    container_name: rppg_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: rppg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rppg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python FastAPI Cloud Backend & POS Signal Processing Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rppg_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword2026@db:5432/rppg_db
      JWT_SECRET_KEY: bme_fyp_super_secure_rppg_jwt_secret_key_2026_!
      STORAGE_DIR: /app/storage/videos
      REPORTS_DIR: /app/storage/reports
      VIDEO_RETENTION_DAYS: 7
    ports:
      - "8000:8000"
    volumes:
      - video_storage:/app/storage/videos
      - report_storage:/app/storage/reports
      - ./web:/app/web:ro  # Mount web app directly to be served at root
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  video_storage:
    driver: local
  report_storage:
    driver: local

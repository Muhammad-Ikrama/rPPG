name: Build Android APK (rPPG Vital Signs)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release -v 2>&1 | tee ../build.log || (echo "### Build Failure Log" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 ../build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - name: Copy APK to Root Staging
        run: |
          echo "Locating built APK..."
          find . -name "*.apk"
          APK_FILE=$(find . -name "*release*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          fi
          echo "Copying $APK_FILE to ./rppg_vital_signs.apk"
          cp "$APK_FILE" ./rppg_vital_signs.apk
          ls -lh ./rppg_vital_signs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rppg-vital-signs-release-apk
          path: ./rppg_vital_signs.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "rPPG Vital Signs Monitor v1.0.0 (Android APK)"
          body: |
            ### Automated Release Build
            Standalone Android APK for the **rPPG Vital Signs Monitor** Final Year Project.
            - Minimum Android SDK: 21 (Android 5.0+)
            - Target Android SDK: 34 (Android 14)
            - Includes camera, storage, and cloud synchronization permissions.
          files: ./rppg_vital_signs.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

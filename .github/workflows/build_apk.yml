name: Build Android APK (rPPG Vital Signs)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Pre-configure Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties
          cat mobile/android/local.properties

      - name: Build Android Release APK
        shell: bash
        run: |
          set -o pipefail
          cd mobile
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee ../flutter_build.log

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp flutter_build.log build_error.txt
          git add build_error.txt
          git commit -m "ci: capture build error log" || true
          git push -f origin build-log || true

      - name: Locate and Stage APK
        run: |
          echo "Finding compiled APKs..."
          find . -name "*.apk"
          APK_FILE=$(find . -name "*release*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" ./rppg_vital_signs.apk
          ls -lh ./rppg_vital_signs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rppg-vital-signs-release-apk
          path: ./rppg_vital_signs.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "rPPG Vital Signs Monitor v1.0.0 (Android APK)"
          body: |
            ### Automated Release Build
            Standalone Android APK for the **rPPG Vital Signs Monitor** Final Year Project.
            - Minimum Android SDK: 21 (Android 5.0+)
            - Target Android SDK: 34 (Android 14)
            - Includes camera, storage, and cloud synchronization permissions.
          files: ./rppg_vital_signs.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
